status:
  scope: >-
    Formalised: the complete proof of the theorem stated in Challenge.lean, including the two
    inputs that the development first took as hypotheses, namely the prime number theorem (from a
    vendored Lean proof of the Wiener–Ikehara theorem) and Andrews' transformation (proved here).
    Not formalised: the identification of zeta2 s with the Kubota–Leopoldt value
    ζ₂(s) = L₂(s, ω^(1−s)) (Lai–Sprang–Zudilin, Lemma 2.8). The Kubota–Leopoldt L-function is not
    defined in Lean here. The identification only involves a non-zero rational factor and does not
    affect irrationality. The theorem says that ζ₂(7), ζ₂(9), ζ₂(11) are not all rational. It does
    not say that two of them are irrational, and it gives no irrationality measure.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: Zeta2.zeta2_7_9_11_not_all_rational_palomar
      file: Solution.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json
      literature_dependencies:
        - statement: >-
            zeta2 s = ζ₂(s) = L₂(s, ω^(1−s)) for integers s ≥ 2. This is needed only to read the
            theorem as a statement about Kubota–Leopoldt values, not for its proof.
          source: "Lai–Sprang–Zudilin, A note on the irrationality of ζ₂(5), Lemma 2.8"

automation:
  methods:
    - method: agent
      models: [claude-opus-5-5]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        One interactive Claude Code session running Claude Opus 5.5, directed by the human
        maintainer, orchestrated the work. It planned the research, launched and integrated the
        subagent workflows listed below, and wrote the blueprint (BLUEPRINT.md), the definitions and
        lemma statements (Zeta2Lean/Defs.lean, Zeta2Lean/Statements.lean, Zeta2Lean/Cited/Defs.lean,
        Zeta2Lean/Cited/Statements.lean), the assembly of the main theorem, and the Challenge,
        Solution and metadata files.
      cost:
        wall_time: >-
          About two days (2026-09-23 to 2026-09-25) for the whole session, including the
          mathematical research; the Lean development is the git history, 2026-09-24 to 2026-09-25.
        spend_usd: "not tracked"
        hardware: >-
          Anthropic API models; Lean builds and exact-arithmetic Python computations on a local
          workstation (32 threads)
    - method: autonomous
      models: [claude-opus-5-5]
      framework: "Claude Code subagents launched by workflow scripts"
      tool_setup: >-
        Research subagents searched for the construction with exact-arithmetic computations and
        wrote the informal proof (docs/proof.md), which adversarial verifier subagents checked.
        Prover subagents, one per proof file, wrote the Lean proofs against frozen statements (the 24
        files of Zeta2Lean/Proofs and the Andrews files of Zeta2Lean/Cited/Proofs). Agents also
        vendored and ported the Wiener–Ikehara files. Scout subagents explored proof routes, for
        example docs/cited/AndrewsScout.lean. Auditor subagents checked the definitions and
        statements for faithfulness and soundness. They wrote exact-arithmetic Python mirrors of the
        statements (python/) and replayed every module with Lean's leanchecker.
      prompting_notes: >-
        Task specifications were the statement docstrings and the "Workflow for provers" sections of
        BLUEPRINT.md. Statements were frozen, and provers reported problems back instead of editing
        them.
  spend_usd: "not tracked"
  notes: >-
    The mathematics (the construction and the informal proof in docs/proof.md) and all Lean code of
    this repository, except the vendored files in Zeta2Lean/Cited/Vendor/PNT (by Terence Tao and the
    PrimeNumberTheoremAnd contributors), were produced by AI agents (Anthropic Claude models; the
    commits are co-authored by Claude Opus 5.5) under the direction of the human maintainer. The
    maintainer posed the research question that led to this work (irrationality of odd zeta
    values), directed and supervised the runs, and is responsible for the submission. No human
    expert has checked the informal proof or the Lean statement. The history of each round is in
    the git log, STATUS.md and BLUEPRINT.md.

fidelity:
  divergences: >-
    (1) zeta2 s is defined as J(s−1)/((s−1)·2^s) through the Volkenborn integral, not as the
    Kubota–Leopoldt value L₂(s, ω^(1−s)). The equality is Lai–Sprang–Zudilin Lemma 2.8, cited and not
    formalised. It only involves a non-zero rational factor, so it does not affect irrationality.
    Other normalisations of ζ₂(s), such as Coleman's or Furusho's with the Euler factor
    (1 − 2^(−s))⁻¹, also differ by a non-zero rational factor. (2) The Volkenborn integral is
    defined by Riemann sums over natural numbers and Mathlib's limUnder. The theorem therefore also
    proves that the Riemann sums of (x+1/2)^(−s) converge to J s, so no unspecified value of
    limUnder enters the statement. (3) "Rational" means "in the image of ℚ → ℚ_[2]". (4) The
    informal proof cites the prime number theorem and Andrews' transformation as published
    results. Both are proved in Lean here; the prime number theorem uses vendored code from open
    mathlib4 pull requests (see sources).

review:
  status: agent-reviewed
  reviewers:
    - "Claude Opus 5.5 auditor and verifier subagents (AI systems, not human reviewers)"
  notes: >-
    Not peer-reviewed: no human expert has checked the informal proof (docs/proof.md) or the formal
    statement. Before submission: (1) two adversarial AI audits (commits 25574c6 and 652d6c8)
    checked the definitions and every lemma statement for faithfulness to the informal proof and for
    soundness (no vacuous statement, no x/0 = 0 or truncated-subtraction loophole). They used
    independent exact-arithmetic Python mirrors (python/mirror.py, python/audit_independent.py,
    python/cited_mirror.py; logs in python/). (2) Lean's kernel replays every module with
    leanchecker in CI. (3) #print axioms of the main theorems lists only propext, Classical.choice
    and Quot.sound. (4) The toolchain's lake comparator, run as Palomar runs it (Challenge compiled
    outside Lake, both modules exported with leanexport, Lean's kernel plus the NanoDa and con-ron
    kernels), accepts Solution.lean against Challenge.lean.

alignment:
  namespace: Zeta2
  statements:
    - source: "docs/proof.md §0, Theorem"
      lean: Zeta2.zeta2_7_9_11_not_all_rational_palomar
      module: Challenge (statement), Solution (proof)
      status: proved
      note: >-
        Solution.lean proves it by Zeta2.zeta2_7_9_11_not_all_rational_unconditional
        (Zeta2Lean/Cited/Main.lean), whose type Zeta2.MainStatement (Zeta2Lean/Statements.lean)
        unfolds to the same proposition.
    - source: "Lai–Sprang–Zudilin, Lemma 2.8 (normalisation of ζ₂(s))"
      lean: Zeta2.zeta2
      module: Challenge, Zeta2Lean.Defs
      status: literature-dependency
      note: "Definition only; the identification with L₂(s, ω^(1−s)) is not formalised."
    - source: "Krattenthaler–Rivoal, Théorème 8 (Andrews 1975, Theorem 4, q → 1)"
      lean: Zeta2.Andrews_proof
      module: Zeta2Lean.Cited.Main
      status: proved
    - source: "Prime number theorem ψ(x)/x → 1"
      lean: Zeta2.PNT_proof
      module: Zeta2Lean.Cited.Main
      status: proved
      note: "From the vendored Lean proof of the Wiener–Ikehara theorem."

