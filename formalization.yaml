# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 (https://github.com/mathlib-initiative/formalization.yaml), with the
# fields Palomar requires (https://github.com/PalomarRegistry/PalomarPolicy/blob/main/CONTRIBUTING.md).
version: "v0.4"

project:
  name: "At least one of the 2-adic zeta values ζ₂(7), ζ₂(9), ζ₂(11) is irrational"
  description: >-
    A Lean 4 and Mathlib proof that at least one of the 2-adic zeta values ζ₂(7), ζ₂(9), ζ₂(11)
    is irrational. The theorem has no hypotheses, and its proof uses only the axioms propext,
    Classical.choice and Quot.sound. The values are defined through the Volkenborn integral:
    zeta2 s = J(s−1)/((s−1)·2^s), where J(s) is the 2-adic limit of the Riemann sums
    2^(−N) Σ_{x<2^N} (x+1/2)^(−s), and the theorem also proves that these limits exist. By
    Lemma 2.8 of Lai, Sprang and Zudilin (IMRN 2026), zeta2 s is the Kubota–Leopoldt value
    ζ₂(s) = L₂(s, ω^(1−s)) for s ≥ 2. That identification is cited, not formalised; it only
    involves a non-zero rational factor, which does not affect irrationality. The result sharpens
    Theorem 1.1 (case s = 3) of L. Lai (Int. J. Number Theory 2025), which shows that at least one
    of ζ₂(7), ζ₂(9), ζ₂(11), ζ₂(13) is irrational. The proof uses linear forms
    S_n = −∫ R_n'''(t+1/2) dt in 1, ζ₂(7), ζ₂(9), ζ₂(11), with
    R_n(t) = 2^(16n)(2t+n)(t+1/2)_n^8/(t)_(n+1)^8. Their denominators are controlled by a one-power
    saving that comes from Andrews' multiple-series transformation (proved here in Lean) and by the
    prime number theorem (proved here from a vendored Lean proof of the Wiener–Ikehara theorem).
    The exact 2-adic valuation of S_n along n = 2^m − 1 shows that S_n ≠ 0, and Lai's
    irrationality criterion concludes. The mathematics and the Lean code were produced by AI agents
    under human direction and have not been refereed.
  # Placeholders: the human author(s) and maintainer(s) must be filled in before submission.
  # AI systems are credited in automation.methods, never here.
  authors:
    - "<<AUTHOR NAME>>"
  responsible_maintainers:
    - "<<AUTHOR NAME>>"
  license: "Apache-2.0"

classification:
  arxiv: [math.NT]
  msc2020: [11J72, 11S40, 11S80, 11M06, 33C20]

sources:
  - title: >-
      At least one of the 2-adic zeta values ζ₂(7), ζ₂(9), ζ₂(11) is irrational (informal proof in
      docs/proof.md of this repository)
    type: original-proof
    id: "docs/proof.md (this repository)"
    relationship: other
    note: >-
      The theorem is first presented here, by the informal proof docs/proof.md and this Lean
      formalisation. Both were produced by AI agents under the direction of the maintainer (see
      automation) and have not been refereed. docs/proof.md §1–2 lists every published lemma it
      uses. Literature search (2026-09-24, by AI agents) in arXiv (with the forward citations of
      Lai's paper), Zenodo, zbMATH, OpenAlex, Crossref, GitHub, and public talks and blogs: the
      only earlier texts that imply the result are the unrefereed drafts of C. D. Long listed below,
      which claim stronger statements; no earlier statement of the result for {7, 9, 11} itself was
      found. Google Scholar, MathSciNet and Lai's thesis were not searched. Novelty beyond that
      search is not established.

  - title: "On the irrationality of certain 2-adic zeta values"
    authors: ["Li Lai"]
    type: paper
    id: "https://doi.org/10.1142/S1793042125500113"
    location: >-
      Int. J. Number Theory 21 (2025), no. 1, 207–235; arXiv:2304.00816. Theorem 1.1 (case s = 3);
      Lemma 2.1 (irrationality criterion); Lemmas 2.4–2.5 (the operators Δ and Δ_m); Section 6
      (dominant term along n = 2^m − 1).
    relationship: other
    note: >-
      Prior result that the recorded theorem sharpens: Theorem 1.1 with s = 3 shows that at least
      one of ζ₂(7), ζ₂(9), ζ₂(11), ζ₂(13) is irrational, and the recorded theorem removes ζ₂(13) by a
      different construction. The proof uses this paper's irrationality criterion, its Δ-operator
      bounds for Volkenborn integrals (after Sprang), and its dominant-term method for the 2-adic
      valuation along n = 2^m − 1, with one new identity. These tools are restated and proved in
      Lean here (Zeta2Lean/Proofs). The paper's theorem itself is not formalised.
    author_endorsement: not-contacted

  - title: "A note on the irrationality of ζ₂(5)"
    authors: ["Li Lai", "Johannes Sprang", "Wadim Zudilin"]
    type: paper
    id: "https://doi.org/10.1093/imrn/rnag180"
    location: >-
      Int. Math. Res. Not. IMRN 2026, no. 16, rnag180; arXiv:2505.05005 (numbering of v2).
      Definition 2.7 and Lemma 2.8 (normalisation of ζ₂(s)); Definitions 3.1–3.2 (rational function
      and linear form); Lemmas 5.2–5.3 (denominators via Andrews' transformation).
    relationship: other
    note: >-
      Lemma 2.8, (s−1)⁻¹ ∫_{ℤ₂} (t+1/2)^(1−s) dt = 2^s ζ₂(s) for s ≥ 2 with
      ζ₂(s) = L₂(s, ω^(1−s)), identifies the Lean definition zeta2 with the Kubota–Leopoldt value.
      This is cited and not formalised. The construction here replaces this paper's rational
      function and linear form for ζ₂(5) (Definitions 3.1–3.2: fourth powers, first derivative) by
      eighth powers and a third derivative. The one-power denominator saving follows the paper's
      Andrews-transformation argument (Lemma 5.3), and is proved in Lean here. The paper gives a new
      proof that ζ₂(5) is irrational.
    author_endorsement: not-contacted

  - title: "Hypergéométrie et fonction zêta de Riemann"
    authors: ["Christian Krattenthaler", "Tanguy Rivoal"]
    type: paper
    id: "https://arxiv.org/abs/math/0311114"
    location: >-
      Mem. Amer. Math. Soc. 186 (2007), no. 875. Théorème 8 (Section 6): Andrews' transformation,
      the q → 1 case of Andrews (1975), Theorem 4.
    relationship: other
    note: >-
      Andrews' transformation of a terminating very-well-poised 2m+5F2m+4 series into an m-fold
      sum is stated in Lean as Zeta2.Andrews_Stmt (any field of characteristic 0, all displayed
      denominators non-zero) and proved in Zeta2Lean/Cited (Zeta2.Andrews_proof), via a q = 1
      Bailey chain and a polynomial Pfaff–Saalschütz identity. It is an ingredient of the proof, not
      the recorded result.
    author_endorsement: not-contacted

  - title: "Problems and prospects for basic hypergeometric functions"
    authors: ["George E. Andrews"]
    type: paper
    id: >-
      In: Theory and Application of Special Functions (R. A. Askey, ed.), Math. Res. Center, Univ.
      Wisconsin, Publ. No. 35, Academic Press, New York, 1975, pp. 191–224
    location: "Theorem 4"
    relationship: other
    note: >-
      Original source of the transformation, as a basic hypergeometric (q-series) identity. Its
      q → 1 limit, in the form stated by Krattenthaler and Rivoal, is what is formalised here.
    author_endorsement: not-contacted

  - title: >-
      The Wiener–Ikehara Tauberian theorem and the prime number theorem, in the Lean 4 proofs of
      mathlib4 pull requests #43046, #43233 and #43238
    authors:
      - "Jose Francisco Antonio Balderas"
      - "Vincent Beffara"
      - "Alex Kontorovich"
      - "Terence Tao"
      - "Ruben Van de Velde"
      - "Arend Mellendijk"
      - "Alastair Irving"
    type: formalization
    id: "https://github.com/leanprover-community/mathlib4/pull/43238"
    location: >-
      Head commit 78e1b2bbd0d256081c926fccada84fd084653286 of pull request #43238, which contains
      #43046 and #43233 (open, not merged in Mathlib as of 2026-09-25). Authors as in the file
      headers.
    relationship: other
    note: >-
      The prime number theorem ψ(x)/x → 1 is needed for log D_n = 11n + o(n). It is proved in Lean
      here (Zeta2.PNT_proof) from the Wiener–Ikehara theorem, whose Lean proof is vendored verbatim,
      with porting notes and the upstream Apache-2.0 headers, in Zeta2Lean/Cited/Vendor/PNT. The
      derivation of the prime number theorem follows WeakPNT.lean of #43238. The pull requests are
      by Terence Tao and adapt code of the PrimeNumberTheoremAnd project (see
      related_formalizations). This is an ingredient of the proof, not the recorded result.
    license: "Apache-2.0"
    author_endorsement: not-contacted

  - title: "Irrationality of certain p-adic periods for small p"
    authors: ["Frank Calegari"]
    type: paper
    id: "https://doi.org/10.1155/IMRN.2005.1235"
    location: "Int. Math. Res. Not. 2005, no. 20, 1235–1249"
    relationship: background
    note: "Irrationality of ζ₂(3) (and ζ₃(3)). Context: the smallest 2-adic zeta values."

  - title: >-
      p-adic Eisenstein series, arithmetic holonomicity criteria, and irrationality of the 2-adic
      period ζ₂(5)
    authors: ["Frank Calegari", "Vesselin Dimitrov", "Yunqing Tang"]
    type: talk slides
    id: "https://people.maths.ox.ac.uk/newton/lnts/VDimitrov-LNT.pdf"
    location: >-
      Slides of a talk by V. Dimitrov (12 June 2020) on joint work with F. Calegari and Y. Tang; see
      also F. Calegari, V. Dimitrov, Y. Tang, Arithmetic holonomy bounds and effective Diophantine
      approximation, arXiv:2510.04156 (2025). Lai–Sprang–Zudilin cite both (references [9] and [12]
      of arXiv:2505.05005v2) for the irrationality of ζ₂(5).
    relationship: background
    note: "Irrationality of ζ₂(5). Context: ζ₂(3) and ζ₂(5) are known to be irrational."

  - title: "Hybrid arithmetic holonomy and twenty-two individual p-adic zeta values"
    authors: ["Christopher D. Long"]
    type: unrefereed draft (GitHub repository)
    id: "https://github.com/octonion/p-adic-zeta-irrationality"
    location: >-
      Commit b46a1770901551961710e155d775aae7c5ea39e7 (2026-08-25): README.md and
      hybrid_arithmetic_holonomy.pdf.
    relationship: background
    note: >-
      Related claim, not used here. The draft claims that ζ₂(s) is irrational for every odd s with
      3 ≤ s ≤ 29 (and ζ₃(s) for odd 3 ≤ s ≤ 11, ζ₅(3), ζ₅(5) and ζ₇(3)), which would imply the
      recorded theorem. It is unrefereed, its README says that independent specialist review
      remains appropriate before publication, and we have not been able to verify its large-prime
      step.
    author_endorsement: not-contacted

  - title: "Multiweight arithmetic holonomy and density-one irrationality of p-adic zeta values"
    authors: ["Christopher D. Long"]
    type: unrefereed draft (GitHub repository)
    id: "https://github.com/octonion/p-adic-zeta-density"
    location: "Commit 4c87bcdf4d7d62d0f1981f16e228901f02cd9f57 (2026-08-26): README.md."
    relationship: background
    note: >-
      Related claim by the same author, not used here: for every fixed prime p, ζ_p(s) is irrational
      for a density-one set of odd s. It is unrefereed, and its README says that independent
      specialist review remains appropriate before publication.
    author_endorsement: not-contacted

